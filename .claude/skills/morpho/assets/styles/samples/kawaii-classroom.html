<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kawaii Sticker: character sample</title>
<!-- A character sample for the Kawaii Sticker style (../kawaii.css): an original chibi boy with huge sparkly eyes, a
     thick plum outline and a white sticker edge, waving in front of a soft, blurred pastel classroom. Idle motion: a
     wave with motion lines, a blink, a little bob. Open it directly in a browser. -->
<style>
  html, body { margin: 0; height: 100%; background: #fbeee4; color: #3b2a33; font: 14px/1.4 "Arial Rounded MT Bold", "Segoe UI", sans-serif; display: grid; place-items: center; }
  main { width: min(96vw, 160vh); }
  svg { display: block; width: 100%; height: auto; border-radius: 30px; box-shadow: 0 0 0 4px #3b2a33, 0 0 0 12px #fff, 0 30px 70px rgba(160, 90, 80, .25); }
  p { margin: 22px 4px 0; color: #8a7480; }
  .a { transform-box: fill-box; }
  .bob { animation: bob 2.2s ease-in-out infinite; transform-origin: 50% 100%; }
  @keyframes bob { 50% { transform: translateY(-8px) rotate(-.6deg); } }
  .wave { animation: wave .9s ease-in-out infinite alternate; transform-origin: 8% 92%; }
  @keyframes wave { from { transform: rotate(-10deg); } to { transform: rotate(8deg); } }
  .blink { animation: blink 3.8s infinite; transform-origin: 50% 50%; }
  @keyframes blink { 0%, 91%, 100% { transform: scaleY(1); } 94% { transform: scaleY(.08); } }
  .lines { animation: lines .9s ease-in-out infinite alternate; }
  @keyframes lines { from { opacity: .2; } to { opacity: 1; } }
  .sparkle { animation: sparkle 1.6s ease-in-out infinite; transform-origin: 50% 50%; }
  @keyframes sparkle { 50% { transform: scale(.75); opacity: .7; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<main>
<svg viewBox="0 0 1600 900" role="img" aria-label="A chibi boy with curly hair, huge sparkly eyes and a pink backpack waves happily, a white sticker outline around him, in front of a soft blurred pastel classroom">
<defs>
  <filter id="soft" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="7"/></filter>
  <filter id="sticker" x="-15%" y="-10%" width="130%" height="125%">
    <feMorphology in="SourceAlpha" operator="dilate" radius="14" result="d"/>
    <feFlood flood-color="#ffffff"/><feComposite in2="d" operator="in" result="w"/>
    <feOffset in="d" dy="10" result="o"/><feGaussianBlur in="o" stdDeviation="8" result="b"/>
    <feFlood flood-color="#a0605a" flood-opacity=".28"/><feComposite in2="b" operator="in" result="s"/>
    <feMerge><feMergeNode in="s"/><feMergeNode in="w"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <radialGradient id="iris" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#9a6a4a"/><stop offset=".7" stop-color="#5a3624"/><stop offset="1" stop-color="#3a2014"/></radialGradient>
</defs>
