<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vintage Cartoon: character sample</title>
<!-- A character sample for the Vintage Cartoon style (../vintage.css): an original boy in the rubber-hose manner of
     early cartoons (bendy limbs, white gloves, pie-cut eyes, big shiny shoes) bouncing along a path to a stone
     schoolhouse, with smiling clouds and flowers that bob on the same beat. Sepia, thick ink, film grain, a flicker and
     a gate weave, like an old reel. Open it directly in a browser. -->
<style>
  html, body { margin: 0; height: 100%; background: #2a2118; color: #f2e4c2; font: 15px/1.4 Rockwell, Georgia, serif; display: grid; place-items: center; }
  main { width: min(96vw, 160vh); }
  .reel { position: relative; border-radius: 18px; overflow: hidden; box-shadow: 0 0 0 5px #1a130d, 0 30px 80px rgba(0, 0, 0, .6); }
  svg { display: block; width: 100%; height: auto; animation: weave .5s steps(3) infinite; }
  @keyframes weave { 0% { transform: translate(0, 0); } 33% { transform: translate(1px, -1px); } 66% { transform: translate(-1px, 1px); } }
  .flick { position: absolute; inset: 0; pointer-events: none; background: #fff6dc; mix-blend-mode: overlay; animation: flick .24s steps(2) infinite; }
  @keyframes flick { 0% { opacity: .02; } 50% { opacity: .08; } }
  p { margin: 12px 4px 0; color: #cdb98e; }
  .a { transform-box: fill-box; }
  .beat { animation: beat .6s ease-in-out infinite alternate; transform-origin: 50% 100%; }
  @keyframes beat { from { transform: translateY(0) scaleY(1); } to { transform: translateY(-12px) scaleY(1.03); } }
  .sway { animation: sway .6s ease-in-out infinite alternate; transform-origin: 50% 100%; }
  .sway.r { animation-direction: alternate-reverse; }
  @keyframes sway { from { transform: rotate(-6deg); } to { transform: rotate(6deg); } }
  .wave { animation: wave .3s ease-in-out infinite alternate; transform-origin: 4% 96%; }
  @keyframes wave { from { transform: rotate(-12deg); } to { transform: rotate(10deg); } }
  .stepA { animation: stepA .6s ease-in-out infinite alternate; transform-origin: 50% 0%; }
  .stepB { animation: stepA .6s ease-in-out infinite alternate-reverse; transform-origin: 50% 0%; }
  @keyframes stepA { from { transform: rotate(14deg); } to { transform: rotate(-14deg); } }
  .smoke { animation: smoke 3s ease-in-out infinite alternate; transform-origin: 50% 100%; }
  @keyframes smoke { to { transform: skewX(8deg) translateY(-6px); } }
  .ring { animation: ring .3s ease-in-out infinite alternate; transform-origin: 50% 0%; }
  @keyframes ring { from { transform: rotate(-14deg); } to { transform: rotate(14deg); } }
  .blink { animation: blink 3.4s infinite; transform-origin: 50% 50%; }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.12); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>

<p>morphO · Vintage Cartoon · character sample: an original rubber-hose boy on the way to school, in sepia ink on an old reel.</p>
</main>
<script>
  // The reel: re-seed the grain and move the scratch a little every frame, as old film never holds still.
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) { const gn = document.getElementById('gn'), sc = document.getElementById('scratch'); let k = 0;
    setInterval(() => { k++; gn.setAttribute('seed', k % 9); const x = (k % 37 < 18) ? 300 + (k * 53) % 1000 : -10; sc.setAttribute('d', `M${x} 0 V900`); }, 90); }
</script>
