<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Survival Short: character sample</title>
<!-- A character sample for the Survival Short style (../survival.css): an upright short in two shots that loop. First an
     aerial title card over a farm in morning haze ("THE BLACKOUT / DAY 1" with a ticking clock pill), then a side shot
     of an original farmer (thin stick limbs, a dot face, a cap) running for the shed with his dog, under a big white
     caption. Flat muted colour, soft shadows, a faint film haze. Open it directly in a browser. -->
<style>
  html, body { margin: 0; height: 100%; background: #1c2018; color: #e8e4d2; font: 14px/1.4 "Bahnschrift", "Segoe UI", sans-serif; display: grid; place-items: center; }
  main { height: min(96vh, 170vw); aspect-ratio: 9 / 16; }
  svg { display: block; width: 100%; height: 100%; border-radius: 12px; box-shadow: 0 0 0 3px #11140e, 0 30px 70px rgba(0, 0, 0, .5); }
  p { margin: 10px 2px 0; color: #9a9a86; font-size: 12px; }
  .a { transform-box: fill-box; }
  .shotA { animation: shotA 12s infinite; } .shotB { animation: shotB 12s infinite; }
  @keyframes shotA { 0%, 46% { opacity: 1; } 50%, 96% { opacity: 0; } 100% { opacity: 1; } }
  @keyframes shotB { 0%, 46% { opacity: 0; } 50%, 96% { opacity: 1; } 100% { opacity: 0; } }
  .push { animation: push 12s linear infinite; transform-origin: 50% 60%; }
  @keyframes push { 0% { transform: scale(1); } 48% { transform: scale(1.08); } 100% { transform: scale(1.08); } }
  .smoke { animation: smoke 3s ease-in-out infinite alternate; transform-origin: 50% 100%; }
  @keyframes smoke { to { transform: translate(8px, -10px) scale(1.1); opacity: .6; } }
  .legA { animation: legA .42s linear infinite alternate; transform-origin: 50% 0%; }
  .legB { animation: legA .42s linear infinite alternate-reverse; transform-origin: 50% 0%; }
  @keyframes legA { from { transform: rotate(38deg); } to { transform: rotate(-34deg); } }
  .armA { animation: legA .42s linear infinite alternate-reverse; transform-origin: 50% 0%; }
  .armB { animation: legA .42s linear infinite alternate; transform-origin: 50% 0%; }
  .run { animation: run .21s ease-in-out infinite alternate; }
  @keyframes run { to { transform: translateY(-12px); } }
  .dogleg { animation: dogleg .3s linear infinite alternate; transform-origin: 50% 0%; }
  .dogleg.b { animation-direction: alternate-reverse; }
  @keyframes dogleg { from { transform: rotate(30deg); } to { transform: rotate(-30deg); } }
  .cap { animation: cap 12s infinite; }
  @keyframes cap { 0%, 56% { opacity: 0; transform: translateY(10px); } 60%, 94% { opacity: 1; transform: none; } 100% { opacity: 0; } }
  .clouds { animation: clouds 30s linear infinite alternate; }
  @keyframes clouds { to { transform: translateX(-60px); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .shotB { opacity: 0; } }
</style>
</head>
<body>
<main>
<svg viewBox="0 0 900 1600" role="img" aria-label="An upright short in two shots: an aerial title card over a hazy farm reading THE BLACKOUT, DAY 1, 6:42 AM; then a farmer in a cap and brown jacket runs with his black-and-white dog towards a wooden shed under the caption ONE SMALL MISTAKE">
<defs>
  <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9ccc0"/><stop offset=".3" stop-color="#b9bfae" stop-opacity=".85"/><stop offset=".55" stop-color="#b9bfae" stop-opacity="0"/></linearGradient>
  <linearGradient id="skyB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fb6bd"/><stop offset="1" stop-color="#d6d7c6"/></linearGradient>
  <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a7f6c"/><stop offset="1" stop-color="#a49883"/></linearGradient>
  <radialGradient id="vig" cx="50%" cy="50%" r="75%"><stop offset=".6" stop-color="#1c2018" stop-opacity="0"/><stop offset="1" stop-color="#1c2018" stop-opacity=".45"/></radialGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="5"/><feColorMatrix values="0 0 0 0 .3  0 0 0 0 .3  0 0 0 0 .25  0 0 0 .25 -.08"/></filter>
</defs>

     <use href="#row" y="81"/><use href="#row" y="166" x="-10"/><use href="#row" y="255" x="-20"/><use href="#row" y="348" x="-30"/><use href="#row" y="445" x="-40"/></g>

  <g><rect x="740" y="520" width="10" height="44" fill="#5a4a36"/><circle cx="745" cy="506" r="36" fill="#4f6a3a"/></g>

   <rect x="232" y="700" width="46" height="60" fill="#3d4049"/><rect x="246" y="716" width="18" height="44" fill="#8a4a2a"/>

  </g>
  <!-- red barn, silo, shed, tractor, water tank -->
  <g><ellipse cx="620" cy="640" rx="110" ry="20" fill="#4f5e3a" opacity=".45"/>

   <rect x="720" y="520" width="34" height="120" rx="16" fill="#c4c4bc"/><ellipse cx="737" cy="520" rx="17" ry="8" fill="#9a9a92"/></g>
  <g><rect x="560" y="700" width="80" height="54" fill="#8a8274"/><path d="M552 704 L600 680 L648 704Z" fill="#4d4a44"/><rect x="590" y="720" width="20" height="34" fill="#4d4a44"/></g>
  <g fill="#3d4049"><rect x="760" y="640" width="30" height="16" rx="3"/><circle cx="764" cy="660" r="7"/><circle cx="788" cy="658" r="10"/></g>
  <g><rect x="94" y="560" width="30" height="26" fill="#6a8aa0"/><path d="M96 586 v30 M122 586 v30" stroke="#5a5a52" stroke-width="3"/></g>
 </g>
 <rect width="900" height="900" fill="url(#haze)"/>
 <!-- the title card -->
 <g font-family="Impact, Haettenschweiler, 'Bahnschrift Condensed', sans-serif" text-anchor="middle">
  <rect x="356" y="130" width="380" height="72" fill="#c8372d"/>
  <text x="250" y="190" font-size="66" fill="#eeeade" stroke="#2a2a22" stroke-width="2" letter-spacing="2">THE</text>
  <text x="546" y="190" font-size="66" fill="#ffffff" letter-spacing="2">BLACKOUT</text>
  <text x="450" y="330" font-size="150" fill="#ffffff" stroke="#2a2a22" stroke-width="6" paint-order="stroke" letter-spacing="4">DAY 1</text>
  <rect x="345" y="358" width="210" height="58" rx="29" fill="#2a2a22" stroke="#e8b830" stroke-width="4"/>
  <text id="clock" x="450" y="400" font-family="Bahnschrift, 'Segoe UI', sans-serif" font-weight="700" font-size="38" fill="#e8b830">6:42 AM</text>
 </g>
</g>

<g class="shotB">

    <path d="M620 330 q10 -24 40 -20 q16 -20 46 -6 q26 0 26 20 h-130 q-8 -6 18 -14Z" opacity=".8"/></g>
  <!-- tree line and fence -->

    <path d="M300 760 L310 720 Q330 690 350 720 L370 680 L390 730 L420 700 L440 760Z" opacity=".85"/></g>
  <rect y="740" width="900" height="30" fill="#8aa06e"/>
  <g stroke="#6a5a44" stroke-width="6"><path d="M0 742 H470 M0 762 H470"/><path d="M20 730 v44 M90 730 v44 M160 730 v44 M230 730 v44 M300 730 v44 M370 730 v44 M440 730 v44" stroke-width="7"/></g>
  <!-- dirt yard and grass -->

  <ellipse cx="300" cy="900" rx="240" ry="50" fill="#b99a6c" opacity=".6"/>
  <rect y="1020" width="900" height="580" fill="#6f8e4f"/>
  <path d="M0 1030 Q200 1010 450 1030 Q700 1050 900 1024 V1060 H0Z" fill="#7f9c5c"/>
  <g filter="url(#soft)" fill="#4f6e3a"><path d="M120 1240 l14 -90 l14 90Z M150 1240 l10 -70 l14 70Z"/><path d="M300 1340 l18 -110 l18 110Z M340 1340 l12 -80 l16 80Z"/><path d="M640 1300 l16 -100 l16 100Z"/></g>
  <!-- the shed -->
  <g>
   <ellipse cx="690" cy="1010" rx="250" ry="26" fill="#3a4a2a" opacity=".35"/>
   <path d="M470 380 L900 330 L900 1000 L470 1000Z" fill="url(#wood)"/>
   <g stroke="#6e6454" stroke-width="5"><path d="M540 372 V1000 M610 364 V1000 M680 356 V1000 M750 348 V1000 M820 340 V1000"/></g>

<rect width="900" height="1600" fill="url(#vig)"/>
<rect width="900" height="1600" filter="url(#grain)" opacity=".5" style="mix-blend-mode: multiply"/>
</svg>
<p>morphO · Survival Short · character sample: an original upright short, a title card and a run for the shed.</p>
</main>
<script>
  // The clock pill ticks a minute every second while the title card shows, as a short's clock races.
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) { const el = document.getElementById('clock'); let m = 42;
    setInterval(() => { m = m >= 59 ? 42 : m + 1; el.textContent = `6:${String(m).padStart(2, '0')} AM`; }, 1000); }
</script>
</body>
</html>
