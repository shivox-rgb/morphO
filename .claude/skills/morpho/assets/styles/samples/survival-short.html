<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Survival Short: character sample</title>
<!-- A character sample for the Survival Short style (../survival.css), in two shots that cross-fade: a farmyard (a red
     barn, a green tractor, smoke on the horizon) where an original farmer stops with his dog, then his kitchen, where he
     fills a water jug while a countdown runs. The farmer is drawn as the style draws people: tall and lanky, about seven
     heads high, a small round head under a cap with one dot eye, a rust jacket to the hips over a green collar, black
     gloves, light jeans and brown boots, all with a thin dark outline and a soft light halo; the dog is a black and white
     collie. Warm side light, sun shafts, a faint haze, big white outlined captions. Open it directly in a browser. -->
<style>
  html, body { margin: 0; height: 100%; background: #1c2018; color: #e8e4d2; font: 14px/1.4 "Bahnschrift", "Segoe UI", sans-serif; display: grid; place-items: center; }
  main { width: min(96vw, 160vh); }
  svg { display: block; width: 100%; height: auto; border-radius: 12px; box-shadow: 0 0 0 3px #11140e, 0 30px 70px rgba(0, 0, 0, .5); }
  p { margin: 12px 4px 0; color: #9a9a86; }
  .a { transform-box: fill-box; }
  .shotA { animation: shotA 14s infinite; } .shotB { animation: shotB 14s infinite; }
  @keyframes shotA { 0%, 46% { opacity: 1; } 50%, 96% { opacity: 0; } 100% { opacity: 1; } }
  @keyframes shotB { 0%, 46% { opacity: 0; } 50%, 96% { opacity: 1; } 100% { opacity: 0; } }
  .pushA { animation: pushA 14s linear infinite; transform-origin: 55% 60%; }
  @keyframes pushA { 0% { transform: scale(1); } 50% { transform: scale(1.06); } 100% { transform: scale(1.06); } }
  .pushB { animation: pushB 14s linear infinite; transform-origin: 40% 55%; }
  @keyframes pushB { 0%, 48% { transform: scale(1.06); } 100% { transform: scale(1); } }
  .capA { animation: capA 14s infinite; } .capB { animation: capB 14s infinite; }
  @keyframes capA { 0%, 6% { opacity: 0; transform: translateY(8px); } 10%, 44% { opacity: 1; transform: none; } 48%, 100% { opacity: 0; } }
  @keyframes capB { 0%, 56% { opacity: 0; transform: translateY(8px); } 60%, 94% { opacity: 1; transform: none; } 98%, 100% { opacity: 0; } }
  .sway { animation: sway 3.2s ease-in-out infinite; transform-origin: 50% 100%; }
  @keyframes sway { 50% { transform: rotate(-1.2deg) translateY(-3px); } }
  .look { animation: look 7s ease-in-out infinite; transform-origin: 50% 90%; }
  @keyframes look { 0%, 30%, 100% { transform: rotate(0); } 40%, 70% { transform: rotate(-7deg); } }
  .blink { animation: blink 4s infinite; transform-origin: 50% 50%; }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  .tail { animation: tail .5s ease-in-out infinite alternate; transform-origin: 0% 50%; }
  @keyframes tail { from { transform: rotate(-14deg); } to { transform: rotate(16deg); } }
  .wag { animation: wag .45s ease-in-out infinite alternate; transform-origin: 100% 0%; }
  @keyframes wag { from { transform: rotate(-10deg); } to { transform: rotate(14deg); } }
  .ear { animation: ear 5s infinite; transform-origin: 50% 100%; }
  @keyframes ear { 0%, 80%, 100% { transform: rotate(0); } 84% { transform: rotate(-14deg); } }
  .smoke { animation: smoke 6s ease-in-out infinite alternate; transform-origin: 50% 100%; }
  @keyframes smoke { to { transform: translate(-30px, -18px) scale(1.08); } }
  .stream { animation: stream .25s linear infinite; }
  @keyframes stream { to { stroke-dashoffset: -24; } }
  .fill { animation: fill 7s linear infinite; transform-origin: 50% 100%; }
  @keyframes fill { from { transform: scaleY(.25); } to { transform: scaleY(.9); } }
  .hand { animation: hand 60s linear infinite; transform-origin: 0 0; }
  .shaft { animation: shaft 6s ease-in-out infinite alternate; }
  @keyframes shaft { to { opacity: .55; } }
  @keyframes hand { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .shotB { opacity: 0; } .capA { opacity: 1; } }
</style>
</head>

<script>
  // The countdown pill ticks down a second at a time, as a short's countdown runs.
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) { const el = document.getElementById('timer'); let s = 27 * 60 + 30;
    setInterval(() => { s = s > 26 * 60 ? s - 1 : 27 * 60 + 30; el.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }, 1000); }
