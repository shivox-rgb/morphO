<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enchanted: character sample</title>
<!-- A character sample for the Enchanted style (../enchanted.css): an original young explorer and her moss sprite in
     a golden-hour forest, drawn in SVG with soft shading (gradients for volume, a warm rim light) and idle motion
     (breathing, blinking, a swaying ponytail, the sprite's ears). Open it directly in a browser. -->
<style>
  :root { --page: #0a1b1a; --chalk: #fff4dc; --dim: #bccab2; }
  html, body { margin: 0; height: 100%; background: var(--page); color: var(--chalk);
    font: 16px/1.4 "Avenir Next", "Segoe UI", sans-serif; display: grid; place-items: center; }
  main { width: min(96vw, 160vh); }
  svg { display: block; width: 100%; height: auto; border-radius: 22px; box-shadow: 0 0 0 1px rgba(255, 214, 150, .3), 0 30px 80px rgba(0, 0, 0, .55); }
  p { margin: 12px 4px 0; color: var(--dim); font-size: 14px; }
  .a { transform-box: fill-box; }
  .breathe { animation: breathe 3.2s ease-in-out infinite; transform-origin: 50% 100%; }
  @keyframes breathe { 50% { transform: translateY(-5px) scaleY(1.008); } }
  .head { animation: tilt 6s ease-in-out infinite; transform-origin: 50% 90%; }
  @keyframes tilt { 0%, 100% { transform: rotate(0deg); } 40% { transform: rotate(-2.2deg); } 70% { transform: rotate(1.4deg); } }
  .blink { animation: blink 4.6s infinite; transform-origin: 50% 50%; }
  @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 95.5% { transform: scaleY(.08); } }
  .pony { animation: sway 2.8s ease-in-out infinite; transform-origin: 10% 90%; }
  @keyframes sway { 50% { transform: rotate(5deg); } }
  .point { animation: point 3.2s ease-in-out infinite; transform-origin: 10% 30%; }
  @keyframes point { 50% { transform: rotate(-4deg); } }
  .map { animation: mapbob 3.2s ease-in-out infinite; transform-origin: 0% 50%; }
  @keyframes mapbob { 50% { transform: rotate(2deg) translateY(-2px); } }
  .sprite { animation: hop 2.4s ease-in-out infinite; transform-origin: 50% 100%; }
  @keyframes hop { 0%, 60%, 100% { transform: translateY(0); } 75% { transform: translateY(-7px); } }
  .earL { animation: twitchL 3.6s ease-in-out infinite; transform-origin: 90% 90%; }
  .earR { animation: twitchR 3.6s ease-in-out infinite; transform-origin: 10% 90%; }
  @keyframes twitchL { 0%, 80%, 100% { transform: rotate(0); } 85% { transform: rotate(-12deg); } 90% { transform: rotate(4deg); } }
  @keyframes twitchR { 0%, 82%, 100% { transform: rotate(0); } 87% { transform: rotate(12deg); } 92% { transform: rotate(-4deg); } }
  .ray { animation: ray 7s ease-in-out infinite; }
  .ray:nth-child(2) { animation-delay: -2.5s; } .ray:nth-child(3) { animation-delay: -4.5s; }
  @keyframes ray { 50% { opacity: .45; } }
  .fly { animation: fly var(--d, 5s) ease-in-out infinite; animation-delay: var(--del, 0s); }
  @keyframes fly { 0%, 100% { opacity: .15; transform: translate(0, 0); } 50% { opacity: 1; transform: translate(var(--dx, 8px), var(--dy, -14px)); } }
  .glowfl { animation: glowfl 4s ease-in-out infinite; }
  @keyframes glowfl { 50% { opacity: .55; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>

<script>
  // Fireflies: a fixed scatter (seeded, so every load looks the same), each drifting and glowing on its own clock.
  const g = document.getElementById('flies'); let s = 7;
  const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  for (let i = 0; i < 38; i++) {
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    const x = 40 + rnd() * 1520, y = 60 + rnd() * 760, r = 2 + rnd() * 3.5;
    c.setAttribute('cx', x.toFixed(0)); c.setAttribute('cy', y.toFixed(0)); c.setAttribute('r', r.toFixed(1));
    c.setAttribute('fill', rnd() < .8 ? '#ffd77a' : '#c9fff4'); c.setAttribute('class', 'fly');
    c.style.cssText = `--d:${(4 + rnd() * 5).toFixed(1)}s;--del:${(-rnd() * 6).toFixed(1)}s;--dx:${(rnd() * 24 - 12).toFixed(0)}px;--dy:${(-6 - rnd() * 16).toFixed(0)}px;filter:drop-shadow(0 0 ${(r * 2).toFixed(0)}px #ffcf6a)`;
    g.appendChild(c);
  }
</script>
