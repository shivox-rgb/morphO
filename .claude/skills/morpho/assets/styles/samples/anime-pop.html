<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anime Pop: character sample</title>
<!-- A character sample for the Anime Pop style (../animepop.css): two original friends in a selfie (Rin, black hair
     with lime and orange streaks, golden eyes, a peace sign; Yuki, silver hair with a cyan streak and headphones,
     winking), in bright anime colours with glossy eyes, fine dark line and doodled hearts and sparkles on white.
     Idle motion: blinking, a bobbing peace sign, twinkling doodles. Open it directly in a browser. -->
<style>
  html, body { margin: 0; height: 100%; background: #f4eef8; color: #1a1a2a; font: 14px/1.4 "Segoe UI", sans-serif; display: grid; place-items: center; }
  main { width: min(96vw, 160vh); }
  svg { display: block; width: 100%; height: auto; border-radius: 22px; box-shadow: 0 30px 70px rgba(122, 92, 255, .18); }
  p { margin: 12px 4px 0; color: #6a6080; }
  .a { transform-box: fill-box; }
  .bob { animation: bob 2.4s ease-in-out infinite; transform-origin: 50% 100%; }
  .bob.b { animation-delay: -1.2s; }
  @keyframes bob { 50% { transform: translateY(-6px) rotate(-.6deg); } }
  .peace { animation: peace .9s ease-in-out infinite alternate; transform-origin: 50% 100%; }
  @keyframes peace { to { transform: rotate(-8deg) translateY(-4px); } }
  .blink { animation: blink 3.8s infinite; transform-origin: 50% 50%; }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.08); } }
  .twinkle { animation: twinkle 1.6s ease-in-out infinite; transform-origin: 50% 50%; }
  .twinkle.b { animation-delay: -.5s; } .twinkle.c { animation-delay: -1s; }
  @keyframes twinkle { 50% { transform: scale(.7) rotate(15deg); opacity: .6; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>

<svg viewBox="0 0 1600 900" role="img" aria-label="Two anime-style friends in a selfie on white: a girl with black hair, lime and orange streaks and golden eyes grins and makes a peace sign, and a girl with silver hair, a cyan streak and magenta headphones winks, with doodled hearts, stars and sparkles around them">
