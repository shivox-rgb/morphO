<title>Flat Cartoon: character sample</title>
<!-- A character sample for the Flat Cartoon style (../cartoon.css): an original boy waving in a sunny schoolyard, drawn
     in bold flat colours with a navy outline, in front of an orange and blue school with a clock, a flagpole and a
     playground. Idle motion: a wave, a blink, a bounce, a flapping flag, drifting clouds. Open it directly in a browser. -->
<style>
  html, body { margin: 0; height: 100%; background: #b9e6f6; color: #1f2a44; font: 14px/1.4 "Segoe UI", sans-serif; display: grid; place-items: center; }
  main { width: min(96vw, 160vh); }
  svg { display: block; width: 100%; height: auto; border-radius: 22px; box-shadow: 0 0 0 4px #1f2a44, 0 10px 0 4px #1f2a44; }
  p { margin: 22px 4px 0; color: #5a6a85; }
  .a { transform-box: fill-box; }
  .bounce { animation: bounce 1.8s ease-in-out infinite; transform-origin: 50% 100%; }
  @keyframes bounce { 50% { transform: translateY(-7px) scaleY(1.01); } }
  .wave { animation: wave .8s ease-in-out infinite alternate; transform-origin: 8% 92%; }
  @keyframes wave { from { transform: rotate(-10deg); } to { transform: rotate(10deg); } }
  .blink { animation: blink 3.6s infinite; transform-origin: 50% 50%; }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  .flag { animation: flag 1.2s ease-in-out infinite alternate; transform-origin: 0% 50%; }
  @keyframes flag { from { transform: skewY(-4deg) scaleX(1); } to { transform: skewY(5deg) scaleX(.92); } }
  .cloud { animation: cloud 16s ease-in-out infinite alternate; }
  .cloud.b { animation-duration: 22s; animation-delay: -8s; }
  @keyframes cloud { to { transform: translateX(60px); } }
  .tick { animation: tick 60s steps(60) infinite; transform-origin: 50% 100%; }
  @keyframes tick { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
