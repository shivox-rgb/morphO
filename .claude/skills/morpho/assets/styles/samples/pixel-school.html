<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Art: character sample</title>
<!-- A character sample for the Pixel Art style (../pixel.css): an original boy waving in front of a schoolhouse,
     drawn at 320 x 180 and snapped to a 30-colour palette (every pixel is one of them), with a dark and then a white
     outline round the boy, redrawn at 8 frames a second like a retro game. The scene is drawn with ordinary canvas
     shapes, so a new pose or prop is a few lines, never a new sprite sheet. Open it directly in a browser. -->
<style>
  html, body { margin: 0; height: 100%; background: #2a3566; color: #dfe6ff; font: 14px/1.4 Consolas, "Courier New", monospace; display: grid; place-items: center; }
  main { width: min(96vw, 160vh); }
  canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; image-rendering: crisp-edges; box-shadow: 0 0 0 6px #1d2340, 12px 12px 0 6px rgba(0, 0, 0, .35); }
  p { margin: 18px 4px 0; color: #9fb0e6; }
</style>
</head>
<body>
<main>
<canvas id="screen" width="320" height="180" role="img" aria-label="Pixel art: a boy with spiky black hair, a colourful jacket and a big backpack waves on a dirt path in front of an orange brick schoolhouse with a bell tower and a clock, trees, a fence, a swing set and a smiling sun"></canvas>
<p>morphO · Pixel Art · character sample: an original boy in front of a schoolhouse, 320 × 180, 30 colours, 8 frames a second.</p>
</main>
<script>
'use strict';
const W = 320, H = 180;
// The palette: every pixel on screen is one of these.
const PAL = ['#1d2340', '#2a3566', '#ffffff', '#dff3fb', '#8fd8fa', '#5fc0f7', '#3fa9f5', '#2f86d6',
  '#ffe066', '#f7b538', '#f28c28', '#d9622b', '#a8452a', '#6b3a2a', '#3d2a26',
  '#9be36d', '#6fd04a', '#3fae49', '#2c8a3f', '#1f6b3a', '#e8c58a', '#c99a5e',
  '#ffd2b0', '#f2a77e', '#c9785a', '#e5484d', '#ff8fa3', '#5fc8e8', '#3a7bd5', '#8a8fa8'];
const RGB = PAL.map(h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]);
const cache = new Map();
const nearest = (r, g, b) => { const k = (r << 16) | (g << 8) | b; let i = cache.get(k); if (i !== undefined) return i;
  let best = 1e9; RGB.forEach((c, j) => { const d = (c[0] - r) ** 2 * .3 + (c[1] - g) ** 2 * .59 + (c[2] - b) ** 2 * .11; if (d < best) { best = d; i = j; } }); cache.set(k, i); return i; };
// Snap a layer to the palette with hard alpha; optionally ring it with an outline of each given colour.
function snap(ctx, rings = []) {
  const im = ctx.getImageData(0, 0, W, H), d = im.data;
  for (let p = 0; p < d.length; p += 4) { if (d[p + 3] < 120) { d[p + 3] = 0; continue; } const c = RGB[nearest(d[p], d[p + 1], d[p + 2])]; d[p] = c[0]; d[p + 1] = c[1]; d[p + 2] = c[2]; d[p + 3] = 255; }
  for (const hex of rings) { const c = RGB[PAL.indexOf(hex)], solid = new Uint8Array(W * H);
    for (let i = 0; i < W * H; i++) solid[i] = d[i * 4 + 3] ? 1 : 0;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { const i = y * W + x; if (solid[i]) continue;
      if ((x > 0 && solid[i - 1]) || (x < W - 1 && solid[i + 1]) || (y > 0 && solid[i - W]) || (y < H - 1 && solid[i + W])) { d[i * 4] = c[0]; d[i * 4 + 1] = c[1]; d[i * 4 + 2] = c[2]; d[i * 4 + 3] = 255; } } }
  ctx.putImageData(im, 0, 0);
}
const layer = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c.getContext('2d', { willReadFrequently: true }); };
const bg = layer(), ch = layer(), scr = document.getElementById('screen').getContext('2d');
const R = (g, c, x, y, w, h) => { g.fillStyle = c; g.fillRect(x, y, w, h); };
const O = (g, c, x, y, rx, ry = rx) => { g.fillStyle = c; g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, 7); g.fill(); };
const P = (g, c, pts) => { g.fillStyle = c; g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath(); g.fill(); };

function drawBg(f) {
  const g = bg; g.clearRect(0, 0, W, H);
  // sky in dithered bands
  const band = (y0, y1, a, b) => { for (let y = y0; y < y1; y++) for (let x = 0; x < W; x++) { const t = (y - y0) / (y1 - y0), bay = [[0, 2], [3, 1]][y & 1][x & 1] / 4; R(g, t > bay + .25 ? b : a, x, y, 1, 1); } };
  R(g, '#3fa9f5', 0, 0, W, 30); band(30, 46, '#3fa9f5', '#5fc0f7'); R(g, '#5fc0f7', 0, 46, W, 20); band(66, 82, '#5fc0f7', '#8fd8fa'); R(g, '#8fd8fa', 0, 82, W, 40);
  // clouds drifting a pixel every few frames
  const cx = (f >> 2) % 400;
  [[30, 22, 1], [110, 16, .8], [220, 26, .9], [300, 40, .7]].forEach(([x, y, s]) => { const X = ((x + cx * s) % 400) - 40;
    O(g, '#ffffff', X, y, 22 * s, 7 * s); O(g, '#ffffff', X - 8 * s, y - 5 * s, 10 * s, 7 * s); O(g, '#ffffff', X + 7 * s, y - 6 * s, 12 * s, 8 * s); R(g, '#dff3fb', X - 20 * s, y + 4 * s, 40 * s, 2); });
  // smiling sun with blinking rays
  O(g, '#f7b538', 290, 26, 12); O(g, '#ffe066', 290, 25, 10);
  if ((f >> 3) & 1) for (let a = 0; a < 8; a++) R(g, '#ffe066', 290 + Math.round(Math.cos(a * .785) * 16) - 1, 26 + Math.round(Math.sin(a * .785) * 16) - 1, 2, 2);
  R(g, '#a8452a', 286, 24, 2, 1); R(g, '#a8452a', 292, 24, 2, 1); R(g, '#a8452a', 287, 28, 6, 1); R(g, '#ff8fa3', 284, 27, 2, 1); R(g, '#ff8fa3', 294, 27, 2, 1);
  // hills
  O(g, '#3fae49', 60, 120, 110, 50); O(g, '#2c8a3f', 250, 124, 120, 40); O(g, '#6fd04a', 60, 118, 70, 30);
  // trees and pines
  const tree = (x, y, r) => { R(g, '#6b3a2a', x - 2, y, 5, 22); O(g, '#2c8a3f', x, y - 4, r, r * .85); O(g, '#3fae49', x - 2, y - 7, r * .7, r * .6); O(g, '#6fd04a', x - 4, y - 10, r * .3, r * .25); };
  const pine = (x, y, h) => { R(g, '#6b3a2a', x - 1, y, 3, 6); P(g, '#1f6b3a', [[x, y - h], [x - h / 2.4, y], [x + h / 2.4, y]]); P(g, '#2c8a3f', [[x, y - h], [x - h / 4, y - h / 2.5], [x + h / 5, y - h / 2.5]]); };
  tree(18, 118, 18); tree(48, 122, 15); pine(168, 128, 34); pine(182, 128, 28); tree(306, 120, 16);
  // fence
  for (let x = 0; x < W; x += 6) R(g, '#c99a5e', x, 120, 3, 12); R(g, '#a8452a', 0, 123, W, 1); R(g, '#a8452a', 0, 128, W, 1);
  // swing set
  P(g, '#3a7bd5', [[58, 124], [60, 124], [68, 102], [66, 102]]); P(g, '#3a7bd5', [[86, 124], [88, 124], [80, 102], [78, 102]]); R(g, '#e5484d', 66, 101, 15, 2); R(g, '#8a8fa8', 71, 103, 1, 12); R(g, '#d9622b', 69, 115, 5, 2);
  // the schoolhouse
  R(g, '#d9622b', 196, 74, 104, 64); for (let y = 76; y < 138; y += 4) for (let x = 196 + ((y >> 2) & 1) * 4; x < 300; x += 8) R(g, '#a8452a', x, y, 6, 1);
  P(g, '#f28c28', [[190, 76], [210, 58], [286, 58], [306, 76]]); for (let x = 194; x < 302; x += 5) R(g, '#d9622b', x, 70, 3, 1);
  R(g, '#3a7bd5', 188, 75, 120, 3);
  R(g, '#f7b538', 230, 48, 36, 90); P(g, '#2f86d6', [[226, 52], [248, 34], [270, 52]]);
  R(g, '#f7b538', 238, 18, 20, 30); P(g, '#2f86d6', [[234, 20], [248, 8], [262, 20]]); R(g, '#3d2a26', 242, 24, 12, 14);
  const bell = (f >> 2) % 4 === 1 ? 1 : (f >> 2) % 4 === 3 ? -1 : 0; O(g, '#ffe066', 248 + bell, 32, 4, 5); R(g, '#f7b538', 244 + bell, 36, 9, 2);
  O(g, '#ffffff', 248, 62, 8); O(g, '#2f86d6', 248, 62, 8.5); O(g, '#ffffff', 248, 62, 7); R(g, '#1d2340', 248, 57, 1, 5); R(g, '#1d2340', 248, 62, 4, 1);
  const win = (x, y) => { R(g, '#ffffff', x - 1, y - 1, 14, 16); R(g, '#5fc8e8', x, y, 12, 14); R(g, '#ffffff', x + 5, y, 2, 14); R(g, '#ffffff', x, y + 6, 12, 2); R(g, '#dff3fb', x + 1, y + 1, 3, 3); };
  win(204, 86); win(204, 112); win(282, 86); win(282, 112); win(236, 76);
  P(g, '#2f86d6', [[230, 102], [248, 90], [266, 102]]); R(g, '#f7b538', 234, 102, 28, 36);
  R(g, '#3fae49', 240, 110, 8, 28); R(g, '#f28c28', 248, 110, 8, 28); R(g, '#ffe066', 246, 122, 1, 2); R(g, '#ffe066', 249, 122, 1, 2);
  R(g, '#8a8fa8', 232, 136, 32, 3); R(g, '#8a8fa8', 228, 139, 40, 3);
  // flagpole and flag
  R(g, '#8a8fa8', 312, 50, 2, 90); O(g, '#dff3fb', 313, 49, 2);
  const fl = (f >> 1) & 1; P(g, '#f28c28', [[311, 52], [298 - fl, 56 + fl], [311, 62]]); R(g, '#ffe066', 306, 56, 3, 2);
  // grass, path, flowers, bushes
  R(g, '#6fd04a', 0, 132, W, 48); for (let x = 0; x < W; x += 7) R(g, '#3fae49', x + ((x * 13) % 5), 136 + ((x * 7) % 30), 2, 2);
  P(g, '#e8c58a', [[90, 180], [230, 180], [262, 142], [234, 142], [150, 160]]); P(g, '#e8c58a', [[0, 168], [90, 160], [140, 180], [0, 180]]);
  for (let i = 0; i < 26; i++) R(g, '#c99a5e', (i * 37) % 260 + 20, 162 + (i * 11) % 16, 2, 1);
  [[120, 150, '#9b6bff'], [205, 146, '#e5484d'], [270, 148, '#e5484d'], [280, 152, '#ff8fa3'], [150, 144, '#ffffff']].forEach(([x, y, c]) => { R(g, '#2c8a3f', x, y + 2, 1, 4); R(g, c, x - 1, y, 3, 3); R(g, '#ffe066', x, y + 1, 1, 1); });
  O(g, '#2c8a3f', 16, 172, 26, 16); O(g, '#3fae49', 12, 168, 18, 11); [[8, 166], [20, 170], [14, 175]].forEach(([x, y]) => R(g, '#e5484d', x, y, 2, 2));
  O(g, '#2c8a3f', 310, 176, 30, 16); O(g, '#3fae49', 306, 172, 20, 10);
  O(g, '#c99a5e', 100, 169, 24, 4);   // the boy's shadow on the path
  snap(bg);
}

function drawKid(f) {
  const g = ch; g.clearRect(0, 0, W, H);
  const bob = (f >> 2) & 1 ? -1 : 0, X = 98, Y = 60 + bob;
  // backpack
  R(g, '#a8452a', X - 30, Y + 30, 24, 44); R(g, '#c9785a', X - 28, Y + 32, 20, 18); R(g, '#d9622b', X - 27, Y + 54, 16, 14); R(g, '#f7b538', X - 20, Y + 40, 4, 4);
  // legs, cuffs, shoes
  R(g, '#2a3566', X - 9, Y + 72, 9, 26); R(g, '#2a3566', X + 3, Y + 72, 9, 26); R(g, '#1d2340', X - 1, Y + 74, 2, 22);
  R(g, '#3a7bd5', X - 10, Y + 94, 11, 3); R(g, '#3a7bd5', X + 2, Y + 94, 11, 3);
  R(g, '#e5484d', X - 13, Y + 97, 14, 6); R(g, '#e5484d', X + 2, Y + 97, 14, 6); R(g, '#ffffff', X - 13, Y + 101, 14, 2); R(g, '#ffffff', X + 2, Y + 101, 14, 2);
  // jacket in colour blocks, open over a stripe
  R(g, '#3fae49', X - 14, Y + 34, 14, 40); R(g, '#f28c28', X, Y + 34, 15, 40); R(g, '#a8452a', X - 14, Y + 66, 29, 8); R(g, '#3a7bd5', X - 14, Y + 34, 8, 14); R(g, '#ffe066', X + 6, Y + 50, 9, 10);
  R(g, '#dff3fb', X - 1, Y + 36, 2, 36); R(g, '#2f86d6', X - 10, Y + 30, 22, 6);
  // near arm on the strap
  R(g, '#a8452a', X - 12, Y + 32, 4, 34); R(g, '#3a7bd5', X - 20, Y + 36, 8, 22); O(g, '#ffd2b0', X - 13, Y + 58, 5);
  // waving arm: an angle each frame, drawn from the shoulder
  const ang = -1.15 + Math.sin(f * .9) * .28;
  g.save(); g.translate(X + 13, Y + 38); g.rotate(ang);
  R(g, '#f28c28', 0, -4, 22, 8); R(g, '#3a7bd5', 16, -4, 6, 8); g.translate(28, 0); O(g, '#ffd2b0', 0, 0, 5.5, 6);
  for (let k = -2; k <= 1; k++) R(g, '#ffd2b0', 4, k * 2.6 - 1, 6, 2); R(g, '#ffd2b0', -2, -8, 3, 5);
  g.restore();
  // head
  R(g, '#f2a77e', X - 3, Y + 26, 7, 6);
  O(g, '#f2a77e', X - 20, Y + 14, 4, 5); O(g, '#ffd2b0', X, Y + 12, 19, 18);
  // spiky hair
  P(g, '#1d2340', [[X - 21, Y + 12], [X - 24, Y - 2], [X - 16, Y - 6], [X - 18, Y - 14], [X - 6, Y - 10], [X - 4, Y - 20], [X + 6, Y - 12], [X + 14, Y - 18], [X + 16, Y - 8], [X + 24, Y - 6], [X + 20, Y + 8], [X + 14, Y], [X + 6, Y + 2], [X - 2, Y - 2], [X - 10, Y + 2], [X - 16, Y + 4]]);
  R(g, '#2a3566', X - 8, Y - 8, 6, 2); R(g, '#2a3566', X + 4, Y - 10, 5, 2);
  // face: eyes blink every few seconds
  if (f % 28 < 26) { R(g, '#3d2a26', X - 9, Y + 9, 4, 6); R(g, '#3d2a26', X + 6, Y + 9, 4, 6); R(g, '#ffffff', X - 9, Y + 9, 2, 2); R(g, '#ffffff', X + 6, Y + 9, 2, 2); }
  else { R(g, '#3d2a26', X - 10, Y + 12, 6, 1); R(g, '#3d2a26', X + 5, Y + 12, 6, 1); }
  R(g, '#1d2340', X - 11, Y + 6, 6, 1); R(g, '#1d2340', X + 5, Y + 6, 6, 1);
  R(g, '#ff8fa3', X - 15, Y + 17, 4, 2); R(g, '#ff8fa3', X + 11, Y + 17, 4, 2);
  R(g, '#a8452a', X - 5, Y + 19, 10, 2); R(g, '#a8452a', X - 4, Y + 21, 8, 2); R(g, '#ffffff', X - 4, Y + 19, 8, 1); R(g, '#ff8fa3', X - 2, Y + 22, 4, 1);
  snap(ch, ['#1d2340', '#ffffff']);
}

let f = 0;
function frame() { drawBg(f); drawKid(f); scr.clearRect(0, 0, W, H); scr.drawImage(bg.canvas, 0, 0); scr.drawImage(ch.canvas, 0, 0); f++; }
frame();
if (!matchMedia('(prefers-reduced-motion: reduce)').matches) setInterval(frame, 125);
</script>
</body>
</html>
