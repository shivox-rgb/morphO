<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Soft Pastel: character sample</title>
<!-- A character sample for the Soft Pastel style (../pastel.css): an original boy waving on a path to a little
     schoolhouse, in calm, muted flat shapes with no outlines (sage, terracotta, cream and dusty blue) and a faint paper
     grain. Idle motion: a wave, a blink, swaying grasses, a drifting cloud, a warm light in the windows. Open it
     directly in a browser. -->
<style>
  html, body { margin: 0; height: 100%; background: #e3e8e0; color: #3f4a44; font: 14px/1.4 "Avenir Next", "Segoe UI", sans-serif; display: grid; place-items: center; }
  main { width: min(96vw, 160vh); }
  svg { display: block; width: 100%; height: auto; border-radius: 28px; box-shadow: 0 0 0 1px #dadfd2, 0 30px 70px rgba(80, 90, 70, .16); }
  p { margin: 12px 4px 0; color: #7d877f; }
  .a { transform-box: fill-box; }
  .bob { animation: bob 2.8s ease-in-out infinite; transform-origin: 50% 100%; }
  @keyframes bob { 50% { transform: translateY(-5px); } }
  .wave { animation: wave 1.1s ease-in-out infinite alternate; transform-origin: 6% 94%; }
  @keyframes wave { from { transform: rotate(-8deg); } to { transform: rotate(9deg); } }
  .blink { animation: blink 4.4s infinite; transform-origin: 50% 50%; }
  @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
  .sway { animation: sway 3.4s ease-in-out infinite alternate; transform-origin: 50% 100%; }
  .sway.b { animation-duration: 4.2s; animation-delay: -1.5s; }
  @keyframes sway { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }
  .drift { animation: drift 20s ease-in-out infinite alternate; }
  @keyframes drift { to { transform: translateX(70px); } }
  .glowwin { animation: glowwin 4s ease-in-out infinite alternate; }
  @keyframes glowwin { to { opacity: .75; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
