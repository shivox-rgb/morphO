<title>Geo Flat: character sample</title>
<!-- A character sample for the Geo Flat style (../geo.css): five original friends arm in arm, built from flat geometric
     shapes with no outlines and no shading beyond a second skin tone, long straight limbs, against a pale blue wall
     and a white floor. Idle motion: the group sways together, blinks, a tapping foot. Open it directly in a browser. -->
<style>
  html, body { margin: 0; height: 100%; background: #c3d4e4; color: #0d1b3d; font: 14px/1.4 "Century Gothic", "Segoe UI", sans-serif; display: grid; place-items: center; }
  main { width: min(96vw, 160vh); }
  svg { display: block; width: 100%; height: auto; border-radius: 4px; box-shadow: 0 30px 60px rgba(13, 27, 61, .18); }
  p { margin: 12px 4px 0; color: #4f6280; }
  .a { transform-box: fill-box; }
  .sway { animation: sway 2.6s ease-in-out infinite alternate; transform-origin: 50% 100%; }
  @keyframes sway { from { transform: rotate(-1.2deg); } to { transform: rotate(1.2deg); } }
  .tap { animation: tap .6s ease-in-out infinite alternate; transform-origin: 10% 90%; }
  @keyframes tap { to { transform: rotate(-14deg); } }
  .blink { animation: blink 4s infinite; transform-origin: 50% 50%; }
  .blink.b { animation-delay: -1.3s; } .blink.c { animation-delay: -2.6s; }
  @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
  .laugh { animation: laugh .5s ease-in-out infinite alternate; transform-origin: 50% 100%; }
  @keyframes laugh { to { transform: translateY(-4px) rotate(-2deg); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
