<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper Collage: character sample</title>
<!-- A character sample for the Paper Collage style (../collage.css): an original boy on his first day of school, cut
     from paper with a white sticker edge, in front of a scrapbook schoolhouse made of brick paper, gingham, polka dots
     and newspaper. Idle motion: a wave, a blink, a little bounce, drifting clouds. Open it directly in a browser. -->
<style>
  html, body { margin: 0; height: 100%; background: #e9dfcb; color: #3a2a1e; font: 14px/1.4 "Avenir Next", "Segoe UI", sans-serif; display: grid; place-items: center; }
  main { width: min(96vw, 160vh); }
  svg { display: block; width: 100%; height: auto; border-radius: 14px; box-shadow: 6px 10px 0 rgba(90, 60, 30, .12), 0 30px 70px rgba(90, 60, 30, .22); }
  p { margin: 12px 4px 0; color: #7a6a58; }
  .a { transform-box: fill-box; }
  .bounce { animation: bounce 2.6s ease-in-out infinite; transform-origin: 50% 100%; }
  @keyframes bounce { 50% { transform: translateY(-6px); } }
  .wave { animation: wave 1.1s ease-in-out infinite alternate; transform-origin: 6% 94%; }
  @keyframes wave { from { transform: rotate(-8deg); } to { transform: rotate(10deg); } }
  .blink { animation: blink 4.2s infinite; transform-origin: 50% 50%; }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  .drift { animation: drift 14s ease-in-out infinite alternate; }
  .drift.b { animation-duration: 18s; animation-delay: -6s; }
  @keyframes drift { to { transform: translateX(40px); } }
  .spin { animation: spin 30s linear infinite; transform-origin: 50% 50%; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .sway { animation: sway 3s ease-in-out infinite alternate; transform-origin: 50% 100%; }
  @keyframes sway { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<main>
<svg viewBox="0 0 1600 900" role="img" aria-label="A paper cut-out boy with a big kraft-paper backpack waves in front of a scrapbook brick schoolhouse with a bell tower, polka-dot and gingham trees, paper clouds and a paper sun">
<defs>

    <feFlood flood-color="#5a3c1e" flood-opacity=".32"/><feComposite in2="b" operator="in" result="s"/>

  <filter id="crumple"><feTurbulence type="fractalNoise" baseFrequency=".012 .02" numOctaves="3" seed="4"/><feColorMatrix values="0 0 0 0 .35  0 0 0 0 .25  0 0 0 0 .12  0 0 0 1.1 -.35"/></filter>
  <filter id="fiber"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="2"/><feColorMatrix values="0 0 0 0 .4  0 0 0 0 .3  0 0 0 0 .15  0 0 0 .5 -.15"/></filter>
  <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse"><rect width="34" height="34" fill="#4f9a46"/><circle cx="9" cy="9" r="7" fill="#b6dd8a"/><circle cx="26" cy="26" r="7" fill="#b6dd8a"/></pattern>

  <pattern id="ginghamR" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fff"/><rect width="12" height="24" fill="#e2574c" opacity=".55"/><rect width="24" height="12" fill="#e2574c" opacity=".55"/></pattern>
  <pattern id="ginghamG" width="30" height="30" patternUnits="userSpaceOnUse"><rect width="30" height="30" fill="#e9f3dc"/><rect width="15" height="30" fill="#6fae55" opacity=".6"/><rect width="30" height="15" fill="#6fae55" opacity=".6"/></pattern>
  <pattern id="bricks" width="56" height="28" patternUnits="userSpaceOnUse"><rect width="56" height="28" fill="#f2d6c8"/><rect x="2" y="2" width="52" height="11" rx="1.5" fill="#c4553f"/><rect x="-26" y="16" width="52" height="11" rx="1.5" fill="#b84b37"/><rect x="30" y="16" width="52" height="11" rx="1.5" fill="#cc5d46"/></pattern>

  <pattern id="patch" width="90" height="90" patternUnits="userSpaceOnUse">

  <linearGradient id="kraft" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d4a46a"/><stop offset="1" stop-color="#b07a42"/></linearGradient>
