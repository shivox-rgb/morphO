<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watercolor Storybook: character sample</title>
<!-- A character sample for the Watercolor Storybook style (../watercolor.css): an original boy walking a meadow path to
     a little brick schoolhouse, painted in soft washes (SVG turbulence gives the bleeding edges) with a fine sepia line,
     on cream paper with a deckled edge. Idle motion: walking on the spot, a wave, a blink, swaying grass. Open it
     directly in a browser. -->
<style>
  html, body { margin: 0; height: 100%; background: #ece2cc; color: #3e3226; font: 15px/1.4 "Iowan Old Style", Georgia, serif; display: grid; place-items: center; }
  main { width: min(96vw, 160vh); }
  svg { display: block; width: 100%; height: auto; }
  p { margin: 8px 4px 0; color: #7d6f5c; font-style: italic; }
  .a { transform-box: fill-box; }
  .walk { animation: walk 1.1s ease-in-out infinite; }
  @keyframes walk { 0%, 50%, 100% { transform: translateY(0); } 25%, 75% { transform: translateY(-6px); } }
  .legA { animation: legA 1.1s ease-in-out infinite; transform-origin: 50% 4%; }
  .legB { animation: legA 1.1s ease-in-out infinite reverse; transform-origin: 50% 4%; }
  @keyframes legA { 0%, 100% { transform: rotate(16deg); } 50% { transform: rotate(-16deg); } }
  .wave { animation: wave 1s ease-in-out infinite alternate; transform-origin: 8% 92%; }
  @keyframes wave { from { transform: rotate(-8deg); } to { transform: rotate(9deg); } }
  .blink { animation: blink 4.4s infinite; transform-origin: 50% 50%; }
  @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
  .grass { animation: grass 3s ease-in-out infinite alternate; transform-origin: 50% 100%; }
  @keyframes grass { from { transform: skewX(-4deg); } to { transform: skewX(4deg); } }
  .leaves { animation: leaves 5s ease-in-out infinite alternate; transform-origin: 50% 100%; }
  @keyframes leaves { to { transform: rotate(1.2deg); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<main>
<svg viewBox="0 0 1600 900" role="img" aria-label="A watercolor painting of a boy with a red backpack walking along a meadow path and waving, a small brick schoolhouse with a bell tower among trees in the distance">
<defs>
  <filter id="wash" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".018" numOctaves="3" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="22" xChannelSelector="R" yChannelSelector="G" result="d"/><feGaussianBlur in="d" stdDeviation="1.4"/></filter>
  <filter id="washSoft" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".01" numOctaves="2" seed="9" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="40" xChannelSelector="R" yChannelSelector="G" result="d"/><feGaussianBlur in="d" stdDeviation="6"/></filter>
  <filter id="washFine" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="2" seed="5" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/></filter>
  <filter id="paper"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" seed="2"/><feColorMatrix values="0 0 0 0 .45  0 0 0 0 .36  0 0 0 0 .22  0 0 0 .55 -.2"/></filter>
  <filter id="deckle"><feTurbulence type="fractalNoise" baseFrequency=".04" numOctaves="3" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="34"/></filter>
  <mask id="edge"><rect x="40" y="36" width="1520" height="828" rx="18" fill="#fff" filter="url(#deckle)"/></mask>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9d6e6"/><stop offset=".55" stop-color="#f3ead0"/><stop offset="1" stop-color="#e9e2b8"/></linearGradient>
  <radialGradient id="sun" cx="30%" cy="30%" r="45%"><stop offset="0" stop-color="#fff5cf"/><stop offset="1" stop-color="#fff5cf" stop-opacity="0"/></radialGradient>
</defs>

<rect width="1600" height="900" fill="#f4ecda"/>
<g mask="url(#edge)">
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#sun)"/>
  <!-- far hills -->
  <g filter="url(#washSoft)">
    <path d="M0 520 Q200 440 420 480 Q640 420 860 470 Q1100 420 1320 460 Q1480 440 1600 470 L1600 640 L0 640Z" fill="#a9c58a" opacity=".75"/>
    <path d="M0 560 Q300 500 600 540 Q900 500 1200 530 Q1420 510 1600 540 L1600 700 L0 700Z" fill="#8fb46a" opacity=".8"/>
    <ellipse cx="420" cy="500" rx="80" ry="40" fill="#7aa058" opacity=".7"/><ellipse cx="900" cy="480" rx="60" ry="34" fill="#7aa058" opacity=".6"/><ellipse cx="1500" cy="470" rx="90" ry="40" fill="#7aa058" opacity=".6"/>
  </g>
  <!-- tree behind the school -->
  <g filter="url(#wash)">
    <path d="M960 600 L970 420 L986 420 L990 600Z" fill="#6b4a30"/>
    <g class="a leaves"><circle cx="940" cy="330" r="100" fill="#7fae4e" opacity=".85"/><circle cx="1020" cy="300" r="90" fill="#94c060" opacity=".8"/><circle cx="980" cy="390" r="80" fill="#6a9a3e" opacity=".75"/></g>
  </g>
  <!-- the schoolhouse -->
  <g transform="translate(-200 10)">
  <g filter="url(#washFine)">
    <rect x="1340" y="200" width="70" height="80" fill="#a8533a"/>
    <path d="M1324 206 L1375 150 L1426 206Z" fill="#6a5040"/>
    <path d="M1352 270 L1352 222 Q1375 200 1398 222 L1398 270Z" fill="#efe4c8"/><path d="M1364 252 Q1364 226 1375 224 Q1386 226 1386 252Z" fill="#c9a24a"/>
    <path d="M1210 380 L1300 280 L1500 280 L1560 380Z" fill="#6e5544"/>
    <path d="M1236 380 L1330 270 L1424 380Z" fill="#b25e40"/>
    <rect x="1236" y="380" width="324" height="200" fill="#b85f42"/>
    <rect x="1440" y="230" width="34" height="60" fill="#9a4a32"/>
    <circle cx="1330" cy="330" r="16" fill="#d8e4e8" stroke="#efe4c8" stroke-width="5"/>
    <path d="M1290 470 L1330 430 L1370 470 L1370 580 L1290 580Z" fill="#efe4c8"/><rect x="1306" y="480" width="48" height="100" fill="#8a5a34"/>
    <g fill="#d8e4e8" stroke="#efe4c8" stroke-width="5"><rect x="1250" y="420" width="30" height="56"/><rect x="1390" y="420" width="30" height="56"/><rect x="1436" y="420" width="30" height="56"/><rect x="1482" y="420" width="30" height="56"/><rect x="1526" y="420" width="24" height="56"/></g>
    <path d="M1286 580 L1374 580 L1386 600 L1274 600Z" fill="#c9bca2"/>
    <ellipse cx="1500" cy="590" rx="80" ry="24" fill="#6a9a3e" opacity=".8"/>
  </g>
  <g fill="none" stroke="#5a4030" stroke-width="1.6" opacity=".6"><path d="M1236 380 L1330 270 L1424 380 M1210 380 L1300 280 L1500 280 L1560 380 M1236 380 V580 H1560 V380"/><path d="M1324 206 L1375 150 L1426 206"/></g>
  </g>
  <!-- the path -->
  <g filter="url(#washSoft)"><path d="M1130 610 Q1100 650 1020 670 Q900 700 900 730 Q880 770 700 800 Q500 830 300 900 L760 900 Q900 840 1020 780 Q1120 730 1140 690 Q1160 650 1150 610Z" fill="#d9b98a" opacity=".9"/></g>
  <!-- meadow -->
  <g filter="url(#washSoft)">
    <path d="M0 640 Q300 600 700 640 Q1000 620 1300 640 Q1450 630 1600 650 L1600 900 L0 900Z" fill="#9cbf62" opacity=".55"/>
  </g>
  <g filter="url(#washSoft)"><path d="M1200 900 Q1300 720 1600 700 L1600 900Z" fill="#7ea84a" opacity=".7"/><path d="M0 900 L0 700 Q200 720 340 900Z" fill="#7ea84a" opacity=".7"/></g>
  <!-- big trees left and right -->
  <g filter="url(#wash)">
    <path d="M120 900 Q150 600 120 300 L190 300 Q200 600 260 900Z" fill="#6b4a30"/>
    <path d="M150 420 Q260 320 380 300 M140 360 Q60 280 20 250 M170 320 Q230 200 330 150" stroke="#6b4a30" stroke-width="22" stroke-linecap="round" fill="none"/>
    <g class="a leaves"><circle cx="120" cy="160" r="150" fill="#7fae4e" opacity=".8"/><circle cx="330" cy="140" r="130" fill="#94c060" opacity=".75"/><circle cx="440" cy="250" r="90" fill="#a9cc6e" opacity=".7"/><circle cx="20" cy="300" r="110" fill="#6a9a3e" opacity=".75"/></g>
    <path d="M1460 900 Q1500 620 1480 330 L1540 330 Q1540 620 1590 900Z" fill="#6b4a30"/>
    <path d="M1490 420 Q1400 330 1330 300 M1510 380 Q1560 260 1600 220" stroke="#6b4a30" stroke-width="20" stroke-linecap="round" fill="none"/>
    <g class="a leaves"><circle cx="1400" cy="170" r="120" fill="#94c060" opacity=".75"/><circle cx="1560" cy="140" r="140" fill="#7fae4e" opacity=".8"/><circle cx="1290" cy="260" r="70" fill="#a9cc6e" opacity=".65"/></g>
  </g>
  <g fill="none" stroke="#4a3424" stroke-width="2" opacity=".55"><path d="M120 900 Q150 600 120 300 M260 900 Q200 600 190 300"/><path d="M1460 900 Q1500 620 1480 330 M1590 900 Q1540 620 1540 330"/></g>
  <!-- grass strokes and wildflowers (drawn by the script below) -->
  <g id="grassBack" class="a grass"></g>

  <!-- the boy, walking and waving -->
  <g transform="translate(470 330)">
   <g class="a walk">
    <ellipse cx="160" cy="520" rx="110" ry="18" fill="#8a6a40" opacity=".25" filter="url(#washSoft)"/>
    <g filter="url(#washFine)">
     <!-- far leg -->
     <g class="a legB"><path d="M140 340 L130 470 L170 470 L176 340Z" fill="#7a5034"/><path d="M118 466 L172 466 L176 490 Q150 504 112 498 Q104 480 118 466Z" fill="#7a4a2a"/><path d="M112 498 L176 492" stroke="#efe6d2" stroke-width="6"/></g>
     <!-- backpack -->
     <path d="M66 200 Q60 150 110 150 L140 156 L150 330 L80 330 Q60 330 62 300Z" fill="#c94436"/>
     <path d="M70 230 L144 230 L146 300 L74 300Z" fill="#4f86b5"/><rect x="88" y="244" width="40" height="10" rx="3" fill="#2f5f8a"/>
     <path d="M66 200 Q100 186 142 196" stroke="#4f86b5" stroke-width="10" fill="none"/>
     <!-- body -->
     <path d="M130 170 Q170 156 210 170 L218 340 L126 340Z" fill="#8eb2c8"/>
     <path d="M140 180 Q170 172 202 180" stroke="#6a8ea8" stroke-width="3" fill="none"/>
     <!-- near leg -->
     <g class="a legA"><path d="M168 336 L176 470 L216 470 L208 336Z" fill="#8a5a38"/><path d="M174 450 L216 450 L218 470 L172 470Z" fill="#a8744a"/><path d="M170 468 L222 468 Q248 476 250 496 L168 498Z" fill="#7a4a2a"/><path d="M168 498 L250 496" stroke="#efe6d2" stroke-width="6"/></g>
     <!-- strap and near arm -->
     <path d="M144 176 Q130 240 148 330" stroke="#c94436" stroke-width="12" fill="none"/>
     <path d="M150 190 Q120 240 150 276" stroke="#e8dcc4" stroke-width="30" stroke-linecap="round" fill="none"/>
     <ellipse cx="156" cy="282" rx="14" ry="13" fill="#f2c4a0"/>
     <!-- waving arm -->
     <g class="a wave"><path d="M206 186 Q246 160 268 100" stroke="#e8dcc4" stroke-width="30" stroke-linecap="round" fill="none"/>
      <path d="M262 108 Q248 86 256 64 L264 64 L268 86 L272 52 L282 52 L280 84 L290 56 L300 60 L292 88 L304 70 L312 76 L298 106 Q286 122 262 108Z" fill="#f2c4a0"/></g>
     <!-- head -->
     <rect x="158" y="140" width="26" height="30" rx="8" fill="#e8b08a"/>
     <ellipse cx="128" cy="96" rx="11" ry="14" fill="#efb894"/>
     <ellipse cx="172" cy="92" rx="52" ry="56" fill="#f4c8a4"/>
     <path d="M122 92 Q110 30 170 28 Q236 24 228 84 Q214 52 196 56 Q206 40 182 44 Q170 60 150 52 Q148 70 134 66 Q128 80 122 92Z" fill="#7a4a28"/>
     <path d="M150 34 Q178 20 210 34" stroke="#a06a3a" stroke-width="4" fill="none" stroke-linecap="round"/>
     <g class="a blink"><ellipse cx="164" cy="96" rx="6" ry="8" fill="#3a2418"/><ellipse cx="200" cy="94" rx="6" ry="8" fill="#3a2418"/><circle cx="162" cy="92" r="2.2" fill="#fff"/><circle cx="198" cy="90" r="2.2" fill="#fff"/></g>
     <path d="M156 80 Q166 74 174 80 M192 78 Q202 72 212 78" stroke="#6a3e22" stroke-width="3" fill="none" stroke-linecap="round"/>
     <ellipse cx="152" cy="114" rx="11" ry="7" fill="#e88a80" opacity=".45"/><ellipse cx="212" cy="112" rx="11" ry="7" fill="#e88a80" opacity=".45"/>
     <path d="M186 102 Q190 110 184 112" stroke="#c8805e" stroke-width="2.2" fill="none"/>
     <path d="M166 122 Q186 142 206 120 Q186 128 166 122Z" fill="#8a3a2a"/><path d="M170 123 Q186 128 202 122 L200 126 Q186 131 172 127Z" fill="#fff"/>
    </g>
    <!-- fine sepia line over the washes -->
    <g fill="none" stroke="#5a4030" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity=".75">
     <ellipse cx="172" cy="92" rx="52" ry="56"/><path d="M130 170 Q170 156 210 170 L218 340 L126 340Z"/><path d="M66 200 Q60 150 110 150 L140 156 L150 330 L80 330 Q60 330 62 300Z"/>
    </g>
   </g>
  </g>
  <g id="grassFront" class="a grass"></g>
  <rect width="1600" height="900" filter="url(#paper)" opacity=".5" style="mix-blend-mode: multiply"/>
</g>
</svg>
<p>morphO · Watercolor Storybook · character sample: an original boy on the meadow path to school, in soft washes and a fine sepia line.</p>
</main>
<script>
  // Grass strokes and wildflowers: a fixed seeded scatter in two layers, behind and in front of the boy.
  let s = 11; const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280, NS = 'http://www.w3.org/2000/svg';
  const add = (g, tag, at) => { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); g.appendChild(e); return e; };
  const greens = ['#6a9a3e', '#7fae4e', '#94c060', '#5a8a36', '#a9cc6e'], petals = ['#f4f0e6', '#f2c94c', '#d65a5a', '#8a7ad8', '#6aa0d8', '#f29a4a'];
  const layer = (id, n, y0, y1, xs) => { const g = document.getElementById(id);
    for (let i = 0; i < n; i++) { const x = xs[0] + rnd() * (xs[1] - xs[0]), y = y0 + rnd() * (y1 - y0), h = 20 + rnd() * 60 * (y / 900), lean = rnd() * 20 - 10;
      if (x > 560 && x < 1100 && y > 700 && y < 860 && rnd() < .7) continue;   // keep the path mostly clear
      add(g, 'path', { d: `M${x} ${y} q${lean / 2} ${-h / 2} ${lean} ${-h}`, stroke: greens[i % 5], 'stroke-width': (1.5 + rnd() * 2.5).toFixed(1), fill: 'none', 'stroke-linecap': 'round', opacity: .85 });
      if (rnd() < .22) add(g, 'circle', { cx: (x + lean).toFixed(0), cy: (y - h).toFixed(0), r: (3 + rnd() * 5 * (y / 900)).toFixed(1), fill: petals[Math.floor(rnd() * petals.length)], opacity: .9 }); } };
  layer('grassBack', 520, 640, 820, [0, 1600]);
  layer('grassFront', 260, 800, 900, [0, 1600]);
</script>
</body>
</html>
