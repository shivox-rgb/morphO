<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glass: character sample</title>
<!-- A character sample for the Glass style (../glass.css): an original kid in the soft-gloss finish (gradients for
     volume, a shine on head and body, no outlines) waving among floating frosted-glass tiles in lavender light.
     Idle motion: a wave, a blink, floating tiles and orbs. Open it directly in a browser. -->
<style>
  html, body { margin: 0; height: 100%; background: #e9ebf8; color: #151b4f; font: 14px/1.4 "Avenir Next", "Segoe UI", sans-serif; display: grid; place-items: center; }
  main { width: min(96vw, 160vh); }
  svg { display: block; width: 100%; height: auto; border-radius: 32px; box-shadow: 0 0 0 1px rgba(255, 255, 255, .95), 0 40px 100px rgba(40, 50, 140, .2); }
  p { margin: 12px 4px 0; color: #6a7096; }
  .a { transform-box: fill-box; }
  .float { animation: float 5s ease-in-out infinite; }
  .float.b { animation-duration: 6s; animation-delay: -2s; } .float.c { animation-duration: 7s; animation-delay: -4s; } .float.d { animation-duration: 5.5s; animation-delay: -1s; }
  @keyframes float { 50% { transform: translateY(-16px); } }
  .bob { animation: bob 3s ease-in-out infinite; transform-origin: 50% 100%; }
  @keyframes bob { 50% { transform: translateY(-8px); } }
  .wave { animation: wave 1s ease-in-out infinite alternate; transform-origin: 10% 90%; }
  @keyframes wave { from { transform: rotate(-10deg); } to { transform: rotate(10deg); } }
  .blink { animation: blink 4s infinite; transform-origin: 50% 50%; }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  .shadow { animation: shadow 3s ease-in-out infinite; transform-origin: 50% 50%; }
  @keyframes shadow { 50% { transform: scaleX(.92); opacity: .7; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<main>
<svg viewBox="0 0 1600 900" role="img" aria-label="A glossy, rounded kid with no outlines waves among floating frosted-glass tiles with chart, briefcase, lightning and card icons, in soft lavender light">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3f4fd"/><stop offset="1" stop-color="#e6e8fa"/></linearGradient>
  <radialGradient id="g1"><stop offset="0" stop-color="#d9b8ff" stop-opacity=".8"/><stop offset="1" stop-color="#d9b8ff" stop-opacity="0"/></radialGradient>
  <radialGradient id="g2"><stop offset="0" stop-color="#a9c2ff" stop-opacity=".75"/><stop offset="1" stop-color="#a9c2ff" stop-opacity="0"/></radialGradient>
  <radialGradient id="g3"><stop offset="0" stop-color="#a8e2ff" stop-opacity=".7"/><stop offset="1" stop-color="#a8e2ff" stop-opacity="0"/></radialGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset=".5" stop-color="#eef0ff" stop-opacity=".45"/><stop offset="1" stop-color="#d8dcff" stop-opacity=".35"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4c63ff"/><stop offset=".6" stop-color="#8a5cf6"/><stop offset="1" stop-color="#c06bff"/></linearGradient>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#4c56be" flood-opacity=".18"/></filter>
  <filter id="blur"><feGaussianBlur stdDeviation="30"/></filter>
  <radialGradient id="skin" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#fff0e6"/><stop offset=".6" stop-color="#ffd2bd"/><stop offset="1" stop-color="#f2ad94"/></radialGradient>
  <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a4f9a"/><stop offset="1" stop-color="#262a66"/></linearGradient>
  <linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7d8cff"/><stop offset=".6" stop-color="#5b6cff"/><stop offset="1" stop-color="#4350d8"/></linearGradient>
  <linearGradient id="arm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b08aff"/><stop offset="1" stop-color="#7c4ff0"/></linearGradient>
  <linearGradient id="leg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2f3784"/><stop offset=".5" stop-color="#454fae"/><stop offset="1" stop-color="#2c3378"/></linearGradient>
  <linearGradient id="shoe" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d9dcf2"/></linearGradient>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<circle cx="1380" cy="140" r="320" fill="url(#g1)"/><circle cx="160" cy="820" r="340" fill="url(#g3)"/><circle cx="900" cy="980" r="380" fill="url(#g2)"/>

<!-- floating orbs -->
<g class="a float c"><circle cx="300" cy="200" r="46" fill="url(#accent)" opacity=".25"/><circle cx="286" cy="186" r="14" fill="#fff" opacity=".7"/></g>
<g class="a float b"><circle cx="1480" cy="640" r="34" fill="url(#accent)" opacity=".25"/></g>

<!-- glass tiles with icons, like the reference's floating keys -->
<g filter="url(#soft)">
  <g class="a float"><g transform="rotate(-12 1040 300)">
    <rect x="950" y="210" width="190" height="190" rx="46" fill="url(#glass)" stroke="#fff" stroke-width="2"/>
    <g fill="url(#accent)"><rect x="1000" y="320" width="22" height="40" rx="8"/><rect x="1034" y="290" width="22" height="70" rx="8"/><rect x="1068" y="260" width="22" height="100" rx="8"/></g>
    <path d="M970 236 Q1040 214 1110 230" stroke="#fff" stroke-width="6" stroke-linecap="round" fill="none" opacity=".8"/></g></g>
  <g class="a float b"><g transform="rotate(10 1270 270)">
    <rect x="1180" y="180" width="180" height="180" rx="44" fill="url(#glass)" stroke="#fff" stroke-width="2"/>
    <rect x="1222" y="240" width="96" height="70" rx="16" fill="url(#accent)"/><path d="M1250 240 v-14 a8 8 0 0 1 8 -8 h24 a8 8 0 0 1 8 8 v14" stroke="url(#accent)" stroke-width="10" fill="none"/><rect x="1262" y="262" width="16" height="12" rx="3" fill="#fff" opacity=".8"/></g></g>
  <g class="a float c"><g transform="rotate(14 1290 520)">
    <rect x="1200" y="430" width="180" height="180" rx="44" fill="url(#glass)" stroke="#fff" stroke-width="2"/>
    <path d="M1300 462 L1250 532 L1286 532 L1272 584 L1334 506 L1296 506Z" fill="url(#accent)"/></g></g>
  <g class="a float d"><g transform="rotate(-6 1060 560)">
    <rect x="940" y="480" width="240" height="160" rx="44" fill="url(#glass)" stroke="#fff" stroke-width="2"/>
    <rect x="990" y="520" width="140" height="86" rx="14" fill="url(#accent)"/><rect x="990" y="540" width="140" height="16" fill="#2a2f80" opacity=".55"/><rect x="1006" y="574" width="42" height="10" rx="5" fill="#fff" opacity=".8"/></g></g>
</g>

<!-- the kid: soft gloss, no outlines -->
<ellipse class="a shadow" cx="560" cy="808" rx="150" ry="22" fill="#4c56be" opacity=".18"/>
<g class="a bob">
  <!-- legs and shoes -->
  <rect x="502" y="620" width="46" height="150" rx="23" fill="url(#leg)"/><rect x="574" y="620" width="46" height="150" rx="23" fill="url(#leg)"/>
  <rect x="486" y="756" width="74" height="40" rx="20" fill="url(#shoe)"/><rect x="562" y="756" width="74" height="40" rx="20" fill="url(#shoe)"/>
  <rect x="490" y="782" width="66" height="10" rx="5" fill="#8a5cf6" opacity=".6"/><rect x="566" y="782" width="66" height="10" rx="5" fill="#8a5cf6" opacity=".6"/>
  <!-- near arm -->
  <rect x="418" y="440" width="54" height="170" rx="27" fill="url(#arm)" transform="rotate(10 445 450)"/>
  <circle cx="430" cy="616" r="28" fill="url(#skin)"/>
  <!-- body -->
  <rect x="456" y="416" width="210" height="240" rx="84" fill="url(#body)"/>
  <ellipse cx="510" cy="460" rx="34" ry="18" fill="#fff" opacity=".45"/>
  <rect x="520" y="560" width="82" height="40" rx="20" fill="#fff" opacity=".18"/>
  <!-- waving arm -->
  <g class="a wave">
    <rect x="640" y="300" width="54" height="170" rx="27" fill="url(#arm)" transform="rotate(30 667 460)"/>
    <circle cx="742" cy="306" r="34" fill="url(#skin)"/>
    <ellipse cx="732" cy="294" rx="10" ry="6" fill="#fff" opacity=".7"/>
  </g>
  <!-- head -->
  <circle cx="560" cy="300" r="128" fill="url(#skin)"/>
  <path d="M434 290 Q430 170 560 164 Q690 168 688 290 Q660 214 560 222 Q470 216 434 290Z" fill="url(#hair)"/>
  <ellipse cx="510" cy="196" rx="44" ry="16" fill="#fff" opacity=".35"/>
  <ellipse cx="500" cy="248" rx="36" ry="20" fill="#fff" opacity=".55"/>
  <g class="a blink"><ellipse cx="514" cy="316" rx="13" ry="18" fill="#151b4f"/><ellipse cx="608" cy="316" rx="13" ry="18" fill="#151b4f"/>
    <circle cx="509" cy="308" r="5" fill="#fff"/><circle cx="603" cy="308" r="5" fill="#fff"/></g>
  <ellipse cx="478" cy="360" rx="24" ry="14" fill="#ff9bb8" opacity=".6"/><ellipse cx="644" cy="360" rx="24" ry="14" fill="#ff9bb8" opacity=".6"/>
  <path d="M534 364 Q560 388 588 364" stroke="#151b4f" stroke-width="7" stroke-linecap="round" fill="none"/>
</g>
</svg>
<p>morphO · Glass · character sample: an original kid in the soft-gloss finish among floating glass tiles.</p>
</main>
</body>
</html>
