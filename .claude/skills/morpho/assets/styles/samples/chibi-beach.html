<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Chibi Anime: character sample</title>
<!-- A character sample for the Chibi Anime style (../chibi.css): an original crew of three (Suzu, a captain with goggles
     and a map; Kai, a lookout with a spyglass; Mochi, a round seal in a sailor cap) in chibi proportions with a thick
     near-black line and glossy anime eyes, on a sunny beach with a plain sailboat. Idle motion: bouncing, blinking,
     waves rolling in, a bobbing boat. Open it directly in a browser. -->
<style>
  html, body { margin: 0; height: 100%; background: #9fdcf8; color: #1b1b2f; font: 14px/1.4 "Segoe UI", sans-serif; display: grid; place-items: center; }
  main { width: min(96vw, 160vh); }
  svg { display: block; width: 100%; height: auto; border-radius: 24px; box-shadow: 0 0 0 4px #1b1b2f; }
  p { margin: 14px 4px 0; color: #1b4f6a; }
  .a { transform-box: fill-box; }
  .hop { animation: hop 1.2s ease-in-out infinite; transform-origin: 50% 100%; }
  .hop.b { animation-delay: -.4s; } .hop.c { animation-delay: -.8s; animation-duration: .9s; }
  @keyframes hop { 0%, 100% { transform: translateY(0) scale(1, 1); } 40% { transform: translateY(-14px) scale(.98, 1.02); } 80% { transform: translateY(0) scale(1.03, .97); } }
  .point { animation: point 1.2s ease-in-out infinite; transform-origin: 6% 80%; }
  @keyframes point { 50% { transform: rotate(-8deg); } }
  .blink { animation: blink 3.6s infinite; transform-origin: 50% 50%; }
  .blink.b { animation-delay: -1.2s; } .blink.c { animation-delay: -2.4s; }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  .boat { animation: boat 3s ease-in-out infinite; transform-origin: 50% 100%; }
  @keyframes boat { 50% { transform: rotate(3deg) translateY(-6px); } }
  .surf { animation: surf 4s ease-in-out infinite; }
  @keyframes surf { 50% { transform: translateY(10px); } }
  .cloud { animation: cloud 20s ease-in-out infinite alternate; }
  @keyframes cloud { to { transform: translateX(60px); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
